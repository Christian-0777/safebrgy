<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Button Loading Animation</title>
<style>
  :root {
    --bg: #FAFAF9;
    --ink: #1C1C1A;
    --accent: #3730A3;
    --accent-dark: #2A2280;
    --dot: #E8E6FF;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .btn {
    position: relative;
    width: 180px;
    height: 52px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transition: background 0.2s ease, width 0.3s ease;
  }

  .btn:hover:not(.is-loading) {
    background: var(--accent-dark);
  }

  .btn:focus-visible {
    outline: 2px solid var(--accent-dark);
    outline-offset: 3px;
  }

  .btn.is-loading {
    width: 64px;
    cursor: default;
  }

  .btn-label {
    transition: opacity 0.15s ease;
  }

  .btn.is-loading .btn-label {
    opacity: 0;
    position: absolute;
  }

  .dots {
    position: absolute;
    display: flex;
    gap: 6px;
    opacity: 0;
    transition: opacity 0.15s ease 0.1s;
  }

  .btn.is-loading .dots {
    opacity: 1;
  }

  .dots span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--dot);
    animation: bounce 1s infinite ease-in-out;
  }

  .dots span:nth-child(2) { animation-delay: 0.15s; }
  .dots span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
    40% { transform: translateY(-6px); opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .dots span { animation: none; opacity: 1; }
    .btn { transition: none; }
  }
</style>
</head>
<body>

  <button class="btn" id="actionBtn">
    <span class="btn-label">This is button</span>
    <span class="dots" aria-hidden="true">
      <span></span><span></span><span></span>
    </span>
  </button>

  <script>
    const btn = document.getElementById('actionBtn');

    btn.addEventListener('click', () => {
      if (btn.classList.contains('is-loading')) return;

      btn.classList.add('is-loading');
      btn.setAttribute('aria-busy', 'true');

      // Simulates a task finishing, then resets the button.
      // Swap this timeout for your real async call.
      setTimeout(() => {
        btn.classList.remove('is-loading');
        btn.removeAttribute('aria-busy');
      }, 2000);
    });
  </script>

</body>
</html>
